<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadete Masculino 1ª · 2026/27</title>
<style>
:root{--bg:#eef3f6;--card:#fff;--text:#152936;--muted:#637987;--line:#d6e0e6;--navy:#0b2942;--blue:#1e6c91;--gold:#e8b94e;--home:#e8f4ec;--away:#e8f1f8;--ha:#1f8a57;--aa:#3b6edc}
body.dark{--bg:#0f1720;--card:#17212b;--text:#edf4f8;--muted:#9fb2c1;--line:#2b3a47;--navy:#dcecf7;--blue:#4f9bc6;--gold:#f4c95d;--home:#19372a;--away:#182d4b;--ha:#5bd18f;--aa:#7ca2ff}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#0b2942,#123f61);color:#fff;padding:18px 14px;position:sticky;top:0;z-index:10} .head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap} h1{margin:0;font-size:clamp(21px,4vw,34px)} header p{margin:4px 0 0;color:#d7e5ee}
.actions,.tabs,.toolbar{display:flex;gap:8px;flex-wrap:wrap} button,input,select{font:inherit} button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer} .secondary{background:var(--card);color:var(--text);border:1px solid var(--line)} .primary{background:var(--gold);color:#183047}
main{max-width:1200px;margin:22px auto;padding:0 14px 40px} .tabs{margin-bottom:14px} .tab{background:#dce7ee;color:#0b2942} .tab.active{background:#0b2942;color:#fff} body.dark .tab{background:#243545;color:#dbe7ef} body.dark .tab.active{background:var(--gold);color:#172b3a}
.notice{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:12px} .sync{font-size:12px;color:var(--muted);margin-top:5px} .sync.ok{color:#198754} .sync.err{color:#b42318}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px} .pill{padding:7px 11px;border-radius:999px;font-size:13px;font-weight:900} .lh{background:var(--home);color:var(--ha)} .la{background:var(--away);color:var(--aa)}
.toolbar{margin-bottom:16px} .toolbar input,.toolbar select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px}
.game{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 7px 18px #0b294212} .game.home{border:2px solid var(--ha)} .game.away{border:2px solid var(--aa)} .gh{padding:9px 12px;background:var(--card);display:flex;justify-content:space-between;font-size:13px;font-weight:900} .home .gh{background:var(--home)} .away .gh{background:var(--away)} .badge{padding:5px 8px;border-radius:999px;color:#fff} .home .badge{background:var(--ha)} .away .badge{background:var(--aa)}
.match{display:grid;grid-template-columns:1fr 58px 1fr;align-items:center;padding:14px 12px 7px;gap:8px} .team{text-align:center;font-weight:900;font-size:12px} .logo{width:64px;height:64px;object-fit:contain;margin:0 auto 7px;display:block} .score{text-align:center;font-size:22px;font-weight:1000} .vs{color:#a06c00;font-size:18px}
.meta{margin:4px 11px 11px;padding:10px;border-radius:9px;background:color-mix(in srgb,var(--card) 90%,var(--blue));display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12px} .meta div:last-child{grid-column:1/-1} .meta strong{display:block;color:var(--muted);font-size:10px;text-transform:uppercase} .edit{margin:0 11px 12px;width:calc(100% - 22px);background:#0b2942;color:#fff}
.round{margin-bottom:22px} .round h2{background:var(--blue);color:#fff;padding:9px 13px;border-radius:11px} .month{color:var(--navy);margin:25px 0 10px} .tablewrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px} table{width:100%;border-collapse:collapse;min-width:760px} th,td{padding:10px;border-bottom:1px solid var(--line);text-align:center;font-size:13px} th{background:#0b2942;color:#fff} .tc{text-align:left;font-weight:900} .nav{background:#fff8df} body.dark .nav{background:#3b3416} .rules{background:var(--card);border:1px solid var(--line);padding:12px;border-radius:12px;margin-bottom:13px;color:var(--muted);font-size:13px}
dialog{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;width:min(520px,calc(100vw - 24px));padding:0} dialog::backdrop{background:#0b294299} .modal{padding:18px} .field{margin:11px 0} .field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px} .field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)} .sf{display:grid;grid-template-columns:1fr 1fr;gap:9px} .ma{display:flex;justify-content:flex-end;gap:8px;margin-top:15px} .loading{text-align:center;padding:50px;color:var(--muted);font-weight:800}
@media(max-width:600px){.match{grid-template-columns:1fr 44px 1fr}.logo{width:56px;height:56px}.team{font-size:11px}} @media print{header,.tabs,.toolbar,.notice,.legend,.edit{display:none!important}body{background:#fff}.game{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header><div class="head"><div><h1>Cadete Masculino 1ª · 2026/27</h1><p>Calendario, resultados y clasificación automática</p></div><div class="actions"><button id="themeBtn" class="secondary">🌙 Modo oscuro</button><button id="refreshBtn" class="secondary">🔄 Actualizar</button><button id="printBtn" class="secondary">🖨️ Imprimir / PDF</button></div></div></header>
<main>
<div class="tabs"><button class="tab active" data-v="coach">🏀 Mi calendario</button><button class="tab" data-v="league">📅 Liga completa</button><button class="tab" data-v="standings">🏆 Clasificación</button></div>
<div class="notice"><b>☁️ Calendario sincronizado:</b> los resultados, fechas, horas y pabellones se comparten entre tus dispositivos.<div id="sync" class="sync">Conectando…</div></div>
<div class="legend"><span class="pill lh">🏠 Partido en casa</span><span class="pill la">✈️ Partido fuera</span></div>
<div class="toolbar" id="toolbar"><input id="searchInput" placeholder="Buscar equipo o pabellón…"><select id="roundFilter"><option value="">Todas las jornadas</option></select></div>
<section id="content"><div class="loading">Cargando calendario…</div></section>
</main>
<dialog id="editor"><form id="editForm" class="modal"><h3 id="editorTitle">Editar partido</h3><input type="hidden" id="editId"><div class="sf"><div class="field"><label>Puntos local</label><input id="editHomeScore" type="number" min="0" step="1"></div><div class="field"><label>Puntos visitante</label><input id="editAwayScore" type="number" min="0" step="1"></div></div><div class="field"><label>Fecha</label><input id="editDate" type="date" required></div><div class="field"><label>Hora</label><input id="editTime" type="time" required></div><div class="field"><label>Localización / pabellón</label><input id="editVenue" required></div><div class="field"><label>Código de edición</label><input id="editCode" type="password" autocomplete="off" placeholder="Código privado" required></div><div class="ma"><button type="button" id="cancelBtn" class="secondary">Cancelar</button><button id="saveBtn" class="primary">Guardar y sincronizar</button></div></form></dialog>
<script>
const API='https://mxflgcwrydqalcvfqhmd.supabase.co/functions/v1/calendar-api',THEME='cm1_2627_theme';
const T={ALI:'ALIMERKA OVIEDO BALONCESTO "A"',GRU:'REAL GRUPO C. COVADONGA',LAV:'C.B. LAVIANA',GIJ:'GIJON BASKET 2015 CORPI',IES:'I.E.S. CARMEN Y SEVERO OCHOA/JOSE GARCIA',CEN:'CENTRO ASTURIANO OVIEDO',CIR:'CIRCULO GIJÓN U16',ART:'C.D.ART-CHIVO PIZZERIA ITALIA',SAN:'SANFER ADBA "A"',NAV:'C.B. NAVIA TALLERES GONFER',ILA:'I-LANZA GIJON CBP "A"',CLI:'CLÍNICA ORDIALES BVM2012'};
const LOGOS={ALI:'assests/logos/ALI.png',ART:'assests/logos/ART.png',CEN:'assests/logos/CEN.png',CIR:'assests/logos/CIR.jpg',CLI:'assests/logos/CLI.png',GIJ:'assests/logos/GIJ.png',GRU:'assests/logos/GRU.png',IES:'assests/logos/IES.png',ILA:'assests/logos/ILA.png',LAV:'assests/logos/LAV.png',NAV:'assests/logos/NAV.jpg',SAN:'assests/logos/SAN.png'};
const E=id=>document.getElementById(id),themeBtn=E('themeBtn'),refreshBtn=E('refreshBtn'),printBtn=E('printBtn'),toolbar=E('toolbar'),searchInput=E('searchInput'),roundFilter=E('roundFilter'),content=E('content'),sync=E('sync'),editor=E('editor'),editForm=E('editForm'),editorTitle=E('editorTitle'),editId=E('editId'),editHomeScore=E('editHomeScore'),editAwayScore=E('editAwayScore'),editDate=E('editDate'),editTime=E('editTime'),editVenue=E('editVenue'),editCode=E('editCode'),saveBtn=E('saveBtn'),cancelBtn=E('cancelBtn');
let games=[],view='coach';
const played=g=>Number.isInteger(g.homeScore)&&Number.isInteger(g.awayScore),fmt=d=>new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(d+'T12:00:00')),mn=k=>new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(new Date(k+'-15T12:00:00'));
function applyTheme(x){document.body.classList.toggle('dark',x==='dark');themeBtn.textContent=x==='dark'?'☀️ Modo claro':'🌙 Modo oscuro';try{localStorage.setItem(THEME,x)}catch(e){}}
function teamVisual(c){return `<img class="logo" src="${LOGOS[c]}" alt="Logo ${T[c]}">`}
function card(g,coach){const home=g.home==='NAV',cls=coach?(home?' home':' away'):'',badge=coach?`<span class="badge">${home?'🏠 LOCAL':'✈️ VISITANTE'}</span>`:'',sc=played(g)?`<div class="score">${g.homeScore}<br><small>—</small><br>${g.awayScore}</div>`:`<div class="score vs">VS</div>`;return `<article class="game${cls}"><div class="gh"><span>JORNADA ${g.round}</span>${badge}</div><div class="match"><div class="team">${teamVisual(g.home)}<div>${T[g.home]}</div></div>${sc}<div class="team">${teamVisual(g.away)}<div>${T[g.away]}</div></div></div><div class="meta"><div><strong>Fecha</strong>${fmt(g.date)}</div><div><strong>Hora</strong>${g.time}</div><div><strong>Localización</strong>${g.venue}</div></div><button class="edit" data-edit="${g.id}">✏️ Editar partido / resultado</button></article>`}
function filtered(){const q=searchInput.value.trim().toLowerCase(),rf=roundFilter.value;return games.filter(g=>!(view==='coach'&&g.home!=='NAV'&&g.away!=='NAV')&&(!rf||String(g.round)===rf)&&(!q||(T[g.home]+' '+T[g.away]+' '+g.venue).toLowerCase().includes(q)))}
function stats(){const s={};Object.keys(T).forEach(k=>s[k]={team:k,PJ:0,G:0,P:0,PF:0,PC:0,PTS:0});games.filter(played).forEach(g=>{const h=s[g.home],a=s[g.away];h.PJ++;a.PJ++;h.PF+=g.homeScore;h.PC+=g.awayScore;a.PF+=g.awayScore;a.PC+=g.homeScore;if(g.homeScore>g.awayScore){h.G++;a.P++;h.PTS+=2;a.PTS++}else{a.G++;h.P++;a.PTS+=2;h.PTS++}});Object.values(s).forEach(x=>x.DIF=x.PF-x.PC);return s}
function mini(codes){const set=new Set(codes),s={};codes.forEach(k=>s[k]={pts:0,dif:0,pf:0});games.filter(g=>played(g)&&set.has(g.home)&&set.has(g.away)).forEach(g=>{const h=s[g.home],a=s[g.away];h.pf+=g.homeScore;a.pf+=g.awayScore;h.dif+=g.homeScore-g.awayScore;a.dif+=g.awayScore-g.homeScore;if(g.homeScore>g.awayScore){h.pts+=2;a.pts++}else{a.pts+=2;h.pts++}});return s}
function standings(){const a=Object.values(stats()).sort((x,y)=>y.PTS-x.PTS),o=[];for(let i=0;i<a.length;){let j=i+1;while(j<a.length&&a[j].PTS===a[i].PTS)j++;const g=a.slice(i,j);if(g.length>1){const m=mini(g.map(x=>x.team));g.sort((x,y)=>(m[y.team].pts-m[x.team].pts)||(m[y.team].dif-m[x.team].dif)||(m[y.team].pf-m[x.team].pf)||(y.DIF-x.DIF)||(y.PF-x.PF)||T[x.team].localeCompare(T[y.team],'es'))}o.push(...g);i=j}return o}
function renderStandings(){toolbar.style.display='none';content.innerHTML=`<div class="rules"><b>Sistema:</b> victoria = 2 puntos, derrota = 1. Los partidos sin resultado no computan. En empates se aplica mini-liga entre los equipos implicados y después diferencia general.</div><div class="tablewrap"><table><thead><tr><th>Pos.</th><th>Equipo</th><th>PJ</th><th>G</th><th>P</th><th>PF</th><th>PC</th><th>Dif.</th><th>Pts.</th></tr></thead><tbody>${standings().map((s,i)=>`<tr class="${s.team==='NAV'?'nav':''}"><td><b>${i+1}</b></td><td class="tc">${T[s.team]}</td><td>${s.PJ}</td><td>${s.G}</td><td>${s.P}</td><td>${s.PF}</td><td>${s.PC}</td><td>${s.DIF>0?'+':''}${s.DIF}</td><td><b>${s.PTS}</b></td></tr>`).join('')}</tbody></table></div>`}
function render(){document.querySelector('.legend').style.display=view==='coach'?'flex':'none';if(view==='standings'){renderStandings();return}toolbar.style.display='flex';const gs=filtered();if(view==='coach'){const m={};gs.forEach(g=>(m[g.date.slice(0,7)]??=[]).push(g));content.innerHTML=Object.keys(m).sort().map(k=>`<h2 class="month">${mn(k)}</h2><div class="grid">${m[k].map(g=>card(g,true)).join('')}</div>`).join('')}else{const r={};gs.forEach(g=>(r[g.round]??=[]).push(g));content.innerHTML=Object.keys(r).sort((a,b)=>a-b).map(x=>`<div class="round"><h2>Jornada ${x}</h2><div class="grid">${r[x].map(g=>card(g,false)).join('')}</div></div>`).join('')}content.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEditor(Number(b.dataset.edit))))}
function normalize(g){return {id:Number(g.id),round:Number(g.round),home:g.home,away:g.away,date:g.game_date,time:(g.game_time||'').slice(0,5),venue:g.venue,homeScore:g.home_score===null?null:Number(g.home_score),awayScore:g.away_score===null?null:Number(g.away_score),updatedAt:g.updated_at}}
async function loadGames(silent=false){if(!silent){sync.className='sync';sync.textContent='Sincronizando…'}try{const r=await fetch(API,{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'No se pudo cargar');games=(j.games||[]).map(normalize);sync.className='sync ok';sync.textContent='✓ Sincronizado · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});render()}catch(e){sync.className='sync err';sync.textContent='⚠ '+e.message;if(!games.length)content.innerHTML='<div class="loading">No se pudo cargar el calendario. Pulsa Actualizar.</div>'}}
function openEditor(i){const g=games.find(x=>x.id===i);if(!g)return;editId.value=i;editDate.value=g.date;editTime.value=g.time;editVenue.value=g.venue;editHomeScore.value=g.homeScore??'';editAwayScore.value=g.awayScore??'';editCode.value='';editorTitle.textContent=`Jornada ${g.round} · ${T[g.home]} vs ${T[g.away]}`;editor.showModal()}
editForm.addEventListener('submit',async e=>{e.preventDefault();const g=games.find(x=>x.id===Number(editId.value)),hs=editHomeScore.value===''?null:Number(editHomeScore.value),as=editAwayScore.value===''?null:Number(editAwayScore.value);if((hs===null)!==(as===null)){alert('Introduce ambos marcadores o deja ambos vacíos.');return}if(hs!==null&&(hs<0||as<0||!Number.isInteger(hs)||!Number.isInteger(as))){alert('Los puntos deben ser enteros positivos.');return}if(hs!==null&&hs===as){alert('En baloncesto no puede haber empate final. Introduce el resultado tras la prórroga.');return}saveBtn.disabled=true;saveBtn.textContent='Guardando…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:editCode.value,id:g.id,home_score:hs,away_score:as,game_date:editDate.value,game_time:editTime.value,venue:editVenue.value.trim()})});const j=await r.json();if(!r.ok)throw new Error(j.error||'No se pudo guardar');const n=normalize(j.game),idx=games.findIndex(x=>x.id===n.id);games[idx]=n;editor.close();sync.className='sync ok';sync.textContent='✓ Cambio guardado y sincronizado';render()}catch(err){alert(err.message)}finally{saveBtn.disabled=false;saveBtn.textContent='Guardar y sincronizar'}});
cancelBtn.addEventListener('click',()=>editor.close());themeBtn.addEventListener('click',()=>applyTheme(document.body.classList.contains('dark')?'light':'dark'));refreshBtn.addEventListener('click',()=>loadGames());printBtn.addEventListener('click',()=>window.print());document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.v;render()}));searchInput.addEventListener('input',render);roundFilter.addEventListener('change',render);for(let i=1;i<=22;i++)roundFilter.insertAdjacentHTML('beforeend',`<option value="${i}">Jornada ${i}</option>`);let savedTheme='light';try{savedTheme=localStorage.getItem(THEME)||'light'}catch(e){}applyTheme(savedTheme);loadGames();setInterval(()=>loadGames(true),30000);
</script>
</body></html>
