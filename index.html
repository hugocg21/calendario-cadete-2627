<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadete Masculino 1ª · 2026/27</title><style>:root{--navy:#0b2942;--blue:#1e6c91;--gold:#e8b94e;--bg:#eef3f6;--card:#fff;--text:#152936;--muted:#637987;--line:#d6e0e6;--home:#e8f4ec;--away:#e8f1f8;--green:#16794a;--red:#b42318;--homea:#1f8a57;--awaya:#3b6edc}body.dark{--navy:#dcecf7;--blue:#4f9bc6;--gold:#f4c95d;--bg:#0f1720;--card:#17212b;--text:#edf4f8;--muted:#9fb2c1;--line:#2b3a47;--home:#19372a;--away:#182d4b;--green:#6fd3a2;--red:#ff9b92;--homea:#5bd18f;--awaya:#7ca2ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,#0b2942,#123f61);color:#fff;padding:20px 16px;position:sticky;top:0;z-index:10}.head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(21px,4vw,34px)}header p{margin:4px 0 0;color:#d7e5ee}.actions,.tabs,.toolbar{display:flex;gap:8px;flex-wrap:wrap}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.lightbtn{background:var(--card);color:var(--text);border:1px solid var(--line)}.danger{background:#fee4e2;color:#b42318}.primary{background:var(--gold);color:#183047}main{max-width:1200px;margin:22px auto;padding:0 14px 40px}.tabs{margin-bottom:15px}.tab{background:#dce7ee;color:#0b2942}.tab.active{background:#0b2942;color:#fff}body.dark .tab{background:#243545;color:#dbe7ef}body.dark .tab.active{background:var(--gold);color:#172b3a}.notice{background:color-mix(in srgb,var(--gold) 18%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line));border-radius:12px;padding:11px 13px;margin-bottom:14px}.legend{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}.pill{padding:7px 11px;border-radius:999px;font-size:13px;font-weight:900}.lh{background:var(--home);color:var(--homea)}.la{background:var(--away);color:var(--awaya)}.toolbar{margin-bottom:16px}.toolbar input,.toolbar select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:13px}.game{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 7px 18px #0b294212;position:relative}.game.home{border:2px solid var(--homea)}.game.away{border:2px solid var(--awaya)}.game.home:before,.game.away:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px}.game.home:before{background:var(--homea)}.game.away:before{background:var(--awaya)}.gh{padding:9px 12px;background:color-mix(in srgb,var(--card) 88%,var(--blue));display:flex;justify-content:space-between;font-size:13px;font-weight:900}.game.home .gh{background:var(--home)}.game.away .gh{background:var(--away)}.badge{padding:5px 8px;border-radius:999px;color:#fff}.home .badge{background:var(--homea)}.away .badge{background:var(--awaya)}.match{display:grid;grid-template-columns:1fr 58px 1fr;align-items:center;padding:14px 12px 7px;gap:8px}.team{text-align:center;font-weight:900;font-size:12px}.icon{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin:0 auto 7px;background:color-mix(in srgb,var(--blue) 14%,var(--card));border:1px solid var(--line);font-weight:1000;color:var(--blue)}.score{text-align:center;font-size:21px;font-weight:1000}.vs{color:#a06c00;font-size:18px}.meta{margin:4px 11px 11px;padding:10px;border-radius:9px;background:color-mix(in srgb,var(--card) 90%,var(--blue));display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12px}.meta div:last-child{grid-column:1/-1}.meta strong{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.edit{margin:0 11px 12px;width:calc(100% - 22px);background:#0b2942;color:#fff}.round{margin-bottom:22px}.round h2{background:var(--blue);color:#fff;padding:9px 13px;border-radius:11px}.month{color:var(--navy);margin:25px 0 10px}.tablewrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:center;font-size:13px}th{background:#0b2942;color:#fff}.tc{text-align:left;font-weight:900}.nav{background:#fff8df}body.dark .nav{background:#3b3416}.rules{background:var(--card);border:1px solid var(--line);padding:12px;border-radius:12px;margin-bottom:13px;color:var(--muted);font-size:13px}dialog{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;width:min(520px,calc(100vw - 24px));padding:0}dialog::backdrop{background:#0b294299}.modal{padding:18px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}.field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)}.sf{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}@media(max-width:600px){.match{grid-template-columns:1fr 44px 1fr}.icon{width:46px;height:46px}.team{font-size:11px}}@media print{header,.tabs,.toolbar,.notice,.legend,.edit{display:none!important}body{background:#fff}.game{break-inside:avoid;box-shadow:none}}</style></head><body><header><div class="head"><div><h1>Cadete Masculino 1ª · 2026/27</h1><p>Calendario, resultados y clasificación automática</p></div><div class="actions"><button id="themeBtn" class="lightbtn" onclick="toggleTheme()">🌙 Modo oscuro</button><button class="lightbtn" onclick="print()">🖨️ Imprimir / PDF</button><button class="danger" onclick="resetAll()">↺ Restaurar todo</button></div></div></header><main><div class="tabs"><button class="tab active" data-v="coach">🏀 Mi calendario</button><button class="tab" data-v="league">📅 Liga completa</button><button class="tab" data-v="standings">🏆 Clasificación</button></div><div class="notice"><b>Resultados:</b> introduce el marcador final. La clasificación se recalcula al instante y los cambios se guardan en este dispositivo.</div><div class="legend"><span class="pill lh">🏠 Partido en casa</span><span class="pill la">✈️ Partido fuera</span></div><div class="toolbar" id="toolbar"><input id="search" placeholder="Buscar equipo o pabellón…"><select id="roundFilter"><option value="">Todas las jornadas</option></select></div><section id="content"></section></main><dialog id="editor"><form method="dialog" class="modal" onsubmit="saveGame(event)"><h3 id="editorTitle">Editar partido</h3><input type="hidden" id="editId"><div class="sf"><div class="field"><label>Puntos local</label><input id="editHomeScore" type="number" min="0" step="1"></div><div class="field"><label>Puntos visitante</label><input id="editAwayScore" type="number" min="0" step="1"></div></div><div class="field"><label>Fecha</label><input id="editDate" type="date" required></div><div class="field"><label>Hora</label><input id="editTime" type="time" required></div><div class="field"><label>Localización / pabellón</label><input id="editVenue" required></div><div class="ma"><button type="button" class="lightbtn" onclick="editor.close()">Cancelar</button><button class="primary">Guardar cambios</button></div></form></dialog><script>const T={ALI:['ALIMERKA OVIEDO BALONCESTO "A"','S','20:00','POL. PUMARIN (OVIEDO)'],GRU:['REAL GRUPO C. COVADONGA','S','16:00','PISTA 6 TENIS'],LAV:['C.B. LAVIANA','D','10:00','POL. POLA DE LAVIANA'],GIJ:['GIJON BASKET 2015 CORPI','S','18:00','PALACIO DEPORTES LA GUIA'],IES:['I.E.S. CARMEN Y SEVERO OCHOA/JOSE GARCIA','D','12:00','POL. PEDRO LLERA LOSADA'],CEN:['CENTRO ASTURIANO OVIEDO','D','10:00','PAB. PRINCIPE DE ASTURIAS'],CIR:['CIRCULO GIJÓN U16','D','18:00','PALACIO DEPORTES LA GUIA'],ART:['C.D.ART-CHIVO PIZZERIA ITALIA','S','20:30','POL. SAN CLAUDIO'],SAN:['SANFER ADBA "A"','D','12:30','COL. SAN FERNANDO'],NAV:['C.B. NAVIA TALLERES GONFER','S','12:00','POL. NAVIA'],ILA:['I-LANZA GIJON CBP "A"','S','10:00','PAB. PERCHERA-LA BRAÑA'],CLI:['CLÍNICA ORDIALES BVM2012','S','20:00','RIOTURBIO CENTER']};const F=[[['ALI','GRU'],['LAV','GIJ'],['IES','CEN'],['CIR','ART'],['SAN','NAV'],['ILA','CLI']],[['CLI','ALI'],['NAV','ILA'],['ART','SAN'],['CEN','CIR'],['GIJ','IES'],['GRU','LAV']],[['ALI','LAV'],['IES','GRU'],['CIR','GIJ'],['SAN','CEN'],['ILA','ART'],['CLI','NAV']],[['NAV','ALI'],['ART','CLI'],['CEN','ILA'],['GIJ','SAN'],['GRU','CIR'],['LAV','IES']],[['ALI','IES'],['CIR','LAV'],['SAN','GRU'],['ILA','GIJ'],['CLI','CEN'],['NAV','ART']],[['ART','ALI'],['CEN','NAV'],['GIJ','CLI'],['GRU','ILA'],['LAV','SAN'],['IES','CIR']],[['ALI','CIR'],['SAN','IES'],['ILA','LAV'],['CLI','GRU'],['NAV','GIJ'],['ART','CEN']],[['CEN','ALI'],['GIJ','ART'],['GRU','NAV'],['LAV','CLI'],['IES','ILA'],['CIR','SAN']],[['ALI','SAN'],['ILA','CIR'],['CLI','IES'],['NAV','LAV'],['ART','GRU'],['CEN','GIJ']],[['ALI','GIJ'],['GRU','CEN'],['LAV','ART'],['IES','NAV'],['CIR','CLI'],['SAN','ILA']],[['ILA','ALI'],['CLI','SAN'],['NAV','CIR'],['ART','IES'],['CEN','LAV'],['GIJ','GRU']]];const RD=['2026-09-20','2026-09-27','2026-10-04','2026-10-18','2026-10-25','2026-11-01','2026-11-08','2026-11-15','2026-11-22','2026-11-29','2026-12-13','2026-12-20','2027-01-17','2027-01-24','2027-01-31','2027-02-07','2027-02-14','2027-02-28','2027-03-07','2027-03-14','2027-03-21','2027-04-04'];const R=[...F,...F.map(r=>r.map(([a,b])=>[b,a]))];let games=[],id=1;R.forEach((r,i)=>r.forEach(([h,a])=>{let d=new Date(RD[i]+'T12:00:00');if(T[h][1]==='S')d.setDate(d.getDate()-1);games.push({id:id++,round:i+1,home:h,away:a,date:d.toISOString().slice(0,10),time:T[h][2],venue:T[h][3],homeScore:null,awayScore:null})}));const ORIGINAL=JSON.parse(JSON.stringify(games)),KEY='cm1_2627_edits_v3',THEME='cm1_2627_theme';let view='coach';const saved=JSON.parse(localStorage.getItem(KEY)||'{}');games=games.map(g=>Object.assign(g,saved[g.id]||{}));const played=g=>Number.isInteger(g.homeScore)&&Number.isInteger(g.awayScore),fmt=d=>new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(d+'T12:00:00')),mn=k=>new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(new Date(k+'-15T12:00:00'));function applyTheme(x){document.body.classList.toggle('dark',x==='dark');themeBtn.textContent=x==='dark'?'☀️ Modo claro':'🌙 Modo oscuro';localStorage.setItem(THEME,x)}function toggleTheme(){applyTheme(document.body.classList.contains('dark')?'light':'dark')}applyTheme(localStorage.getItem(THEME)||'light');function icon(c){return `<div class="icon">${c}</div>`}function card(g,coach){let home=g.home==='NAV',cls=coach?(home?' home':' away'):'',badge=coach?`<span class="badge">${home?'🏠 LOCAL':'✈️ VISITANTE'}</span>`:'',sc=played(g)?`<div class="score">${g.homeScore}<br><small>—</small><br>${g.awayScore}</div>`:`<div class="score vs">VS</div>`;return `<article class="game${cls}"><div class="gh"><span>JORNADA ${g.round}</span>${badge}</div><div class="match"><div class="team">${icon(g.home)}<div>${T[g.home][0]}</div></div>${sc}<div class="team">${icon(g.away)}<div>${T[g.away][0]}</div></div></div><div class="meta"><div><strong>Fecha</strong>${fmt(g.date)}</div><div><strong>Hora</strong>${g.time}</div><div><strong>Localización</strong>${g.venue}</div></div><button class="edit" onclick="openEditor(${g.id})">✏️ Editar partido / resultado</button></article>`}function filtered(){let q=search.value.trim().toLowerCase(),rf=roundFilter.value;return games.filter(g=>!(view==='coach'&&g.home!=='NAV'&&g.away!=='NAV')&&(!rf||String(g.round)===rf)&&(!q||(T[g.home][0]+' '+T[g.away][0]+' '+g.venue).toLowerCase().includes(q)))}function stats(){let s={};Object.keys(T).forEach(k=>s[k]={team:k,PJ:0,G:0,P:0,PF:0,PC:0,PTS:0});games.filter(played).forEach(g=>{let h=s[g.home],a=s[g.away];h.PJ++;a.PJ++;h.PF+=g.homeScore;h.PC+=g.awayScore;a.PF+=g.awayScore;a.PC+=g.homeScore;if(g.homeScore>g.awayScore){h.G++;a.P++;h.PTS+=2;a.PTS++}else{a.G++;h.P++;a.PTS+=2;h.PTS++}});Object.values(s).forEach(x=>x.DIF=x.PF-x.PC);return s}function mini(codes){let set=new Set(codes),s={};codes.forEach(k=>s[k]={pts:0,dif:0,pf:0});games.filter(g=>played(g)&&set.has(g.home)&&set.has(g.away)).forEach(g=>{let h=s[g.home],a=s[g.away];h.pf+=g.homeScore;a.pf+=g.awayScore;h.dif+=g.homeScore-g.awayScore;a.dif+=g.awayScore-g.homeScore;if(g.homeScore>g.awayScore){h.pts+=2;a.pts++}else{a.pts+=2;h.pts++}});return s}function standings(){let a=Object.values(stats()).sort((x,y)=>y.PTS-x.PTS),o=[];for(let i=0;i<a.length;){let j=i+1;while(j<a.length&&a[j].PTS===a[i].PTS)j++;let g=a.slice(i,j);if(g.length>1){let m=mini(g.map(x=>x.team));g.sort((x,y)=>(m[y.team].pts-m[x.team].pts)||(m[y.team].dif-m[x.team].dif)||(m[y.team].pf-m[x.team].pf)||(y.DIF-x.DIF)||(y.PF-x.PF)||T[x.team][0].localeCompare(T[y.team][0],'es'))}o.push(...g);i=j}return o}function renderStandings(){toolbar.style.display='none';content.innerHTML=`<div class="rules"><b>Sistema:</b> victoria = 2 puntos, derrota = 1. Un partido sin resultado no computa. Desempates: puntos entre empatados, diferencia entre ellos, puntos anotados entre ellos, diferencia general y puntos anotados.</div><div class="tablewrap"><table><thead><tr><th>Pos.</th><th>Equipo</th><th>PJ</th><th>G</th><th>P</th><th>PF</th><th>PC</th><th>Dif.</th><th>Pts.</th></tr></thead><tbody>${standings().map((s,i)=>`<tr class="${s.team==='NAV'?'nav':''}"><td><b>${i+1}</b></td><td class="tc">${T[s.team][0]}</td><td>${s.PJ}</td><td>${s.G}</td><td>${s.P}</td><td>${s.PF}</td><td>${s.PC}</td><td>${s.DIF>0?'+':''}${s.DIF}</td><td><b>${s.PTS}</b></td></tr>`).join('')}</tbody></table></div>`}function render(){document.querySelector('.legend').style.display=view==='coach'?'flex':'none';if(view==='standings'){renderStandings();return}toolbar.style.display='flex';let gs=filtered();if(view==='coach'){let m={};gs.forEach(g=>(m[g.date.slice(0,7)]??=[]).push(g));content.innerHTML=Object.keys(m).sort().map(k=>`<h2 class="month">${mn(k)}</h2><div class="grid">${m[k].map(g=>card(g,true)).join('')}</div>`).join('')}else{let r={};gs.forEach(g=>(r[g.round]??=[]).push(g));content.innerHTML=Object.keys(r).sort((a,b)=>a-b).map(x=>`<div class="round"><h2>Jornada ${x}</h2><div class="grid">${r[x].map(g=>card(g,false)).join('')}</div></div>`).join('')}}function openEditor(i){let g=games.find(x=>x.id===i);editId.value=i;editDate.value=g.date;editTime.value=g.time;editVenue.value=g.venue;editHomeScore.value=g.homeScore??'';editAwayScore.value=g.awayScore??'';editorTitle.textContent=`Jornada ${g.round} · ${T[g.home][0]} vs ${T[g.away][0]}`;editor.showModal()}function saveGame(e){e.preventDefault();let g=games.find(x=>x.id===Number(editId.value)),hs=editHomeScore.value===''?null:Number(editHomeScore.value),as=editAwayScore.value===''?null:Number(editAwayScore.value);if((hs===null)!==(as===null)){alert('Introduce ambos marcadores o deja ambos vacíos.');return}if(hs!==null&&(hs<0||as<0||!Number.isInteger(hs)||!Number.isInteger(as))){alert('Los puntos deben ser enteros positivos.');return}if(hs!==null&&hs===as){alert('En baloncesto no puede haber empate final. Introduce el resultado tras la prórroga.');return}Object.assign(g,{homeScore:hs,awayScore:as,date:editDate.value,time:editTime.value,venue:editVenue.value.trim()});let ch={};games.forEach(c=>{let o=ORIGINAL.find(x=>x.id===c.id);if(c.date!==o.date||c.time!==o.time||c.venue!==o.venue||c.homeScore!==o.homeScore||c.awayScore!==o.awayScore)ch[c.id]={date:c.date,time:c.time,venue:c.venue,homeScore:c.homeScore,awayScore:c.awayScore}});localStorage.setItem(KEY,JSON.stringify(ch));editor.close();render()}function resetAll(){if(!confirm('¿Restaurar calendario y borrar resultados de este dispositivo?'))return;localStorage.removeItem(KEY);games=JSON.parse(JSON.stringify(ORIGINAL));render()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.v;render()});search.oninput=render;roundFilter.onchange=render;for(let i=1;i<=22;i++)roundFilter.insertAdjacentHTML('beforeend',`<option value="${i}">Jornada ${i}</option>`);render();</script></body></html>
